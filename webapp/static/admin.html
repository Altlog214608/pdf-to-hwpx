<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>이용 기록</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="app.css">
  <script>try { var th = localStorage.getItem("pdf2hwpx:theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}</script>
  <style>
    .admin { max-width: 1120px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 16px; }
    .admin h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .admin .sub { color: var(--muted); font-size: 13.5px; margin: 4px 0 0; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .controls .seg { grid-template-columns: repeat(4, auto); }
    .controls .seg button { padding: 7px 12px; }
    .controls select { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13.5px; }
    .controls .spacer { flex: 1; }
    a.btn-outline { color: var(--text); text-decoration: none; display: inline-block; }
    .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .tile { padding: 14px 16px; }
    .tile span { display: block; color: var(--muted); font-size: 12.5px; }
    .tile b { display: block; font-size: 26px; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tile small { color: var(--muted); font-size: 12px; }
    .grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
    .card-body { padding: 14px 18px 18px; }
    .chart { position: relative; height: 180px; display: flex; align-items: flex-end; gap: 2px; padding: 0 0 22px; border-bottom: 1px solid var(--line); }
    .chart .gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); pointer-events: none; }
    .chart .gridline span { position: absolute; right: 0; top: -15px; font-size: 11px; color: var(--muted); }
    .cbar { flex: 1 1 0; min-width: 2px; height: 100%; display: flex; align-items: flex-end; position: relative; cursor: default; }
    .cbar i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
    .cbar:hover i { filter: brightness(1.12); }
    .cbar em { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; opacity: 0; transition: opacity .1s; z-index: 10; white-space: nowrap; }
    .tip.show { opacity: 1; }
    .empty { color: var(--muted); font-size: 13.5px; padding: 24px 0; text-align: center; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td.muted:last-child { white-space: normal; min-width: 200px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 7px; background: var(--surface-2); font-size: 12px; font-weight: 600; }
    .tag.bad { color: var(--danger); }
    .tag.warn { color: var(--warn); }
    .tag.good { color: var(--ok); }
    .muted { color: var(--muted); }
    .live { font-size: 12.5px; color: var(--muted); }
    .kept-name { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
    .kept-cause { white-space: normal !important; min-width: 200px; color: var(--muted); font-size: 12.5px; }
    .kept-act { display: flex; gap: 6px; }
    .kept-act a, .kept-act button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer; }
    .kept-act a:hover { border-color: var(--accent); color: var(--accent); }
    .kept-act button:hover { border-color: var(--danger); color: var(--danger); }
    @media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
    @media (max-width: 480px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile b { font-size: 22px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="변환 화면으로">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="8"/><path d="M10 11h12M10 16h12M10 21h7"/></svg></span>
      <span class="brand-text">PDF <span class="arrow">→</span> 한글</span>
    </a>
  </header>

  <main class="admin">
    <div>
      <h1>이용 기록</h1>
      <p class="sub">누가 언제 몇 쪽·몇 문제를 변환했는지만 남깁니다. 업로드한 파일의 내용과 이름은 기록하지 않아요. <span id="keep"></span></p>
    </div>

    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="기간">
        <button type="button" role="radio" data-days="7" aria-checked="false">7일</button>
        <button type="button" role="radio" data-days="30" aria-checked="true">30일</button>
        <button type="button" role="radio" data-days="90" aria-checked="false">90일</button>
        <button type="button" role="radio" data-days="365" aria-checked="false">1년</button>
      </div>
      <select id="who" aria-label="사람"><option value="">모든 사람</option></select>
      <span class="spacer"></span>
      <span class="live" id="live"></span>
      <a class="btn-outline" id="csv" href="/api/admin/usage.csv" download>CSV 내려받기</a>
    </div>

    <section class="tiles" id="tiles" aria-label="요약"></section>

    <article class="card" id="kept-card" hidden>
      <header class="card-head"><h2>문제 생긴 파일</h2><span class="hint" id="kept-hint"></span></header>
      <div class="card-body table-wrap"><table id="kept"></table></div>
    </article>

    <div class="grid2">
      <article class="card">
        <header class="card-head"><h2>변환 횟수</h2><span class="hint" id="chart-hint"></span></header>
        <div class="card-body"><div class="chart" id="chart" role="img" aria-label="기간별 변환 횟수 막대 그래프"></div></div>
      </article>
      <article class="card">
        <header class="card-head"><h2>사람별</h2><span class="hint">기간 안</span></header>
        <div class="card-body table-wrap"><table id="people"></table></div>
      </article>
    </div>

    <article class="card">
      <header class="card-head"><h2>최근 기록</h2><span class="hint" id="recent-hint"></span></header>
      <div class="card-body table-wrap"><table id="recent"></table></div>
      <div class="card-body" style="padding-top:0"><button class="btn-outline" id="more" type="button" hidden>더 보기</button></div>
    </article>
  </main>
  <div class="tip" id="tip" role="tooltip"></div>

  <script>
  (() => {
    "use strict";
    const $ = (s) => document.querySelector(s);
    const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const num = (n) => (n == null || n === "" ? "" : Number(n).toLocaleString("ko-KR"));
    const pad = (n) => String(n).padStart(2, "0");
    const fmtTime = (ts) => { const d = new Date(ts * 1000); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const ago = (ts) => {
      const s = Date.now() / 1000 - ts;
      if (s < 3600) return `${Math.max(1, Math.round(s / 60))}분 전`;
      if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
      return `${Math.round(s / 86400)}일 전`;
    };
    const STATUS = {
      PASS: ["통과", "good"], WARN: ["확인 필요", "warn"], FAIL: ["문제 있음", "bad"],
      ok: ["정상", "good"], garbled: ["글자 깨짐 의심", "warn"], scanned: ["스캔본", "bad"], unreadable: ["읽기 실패", "bad"],
    };
    const DETAIL = { kind: { hwpx: "한글 파일", zip: "ZIP", merged: "통합본" } };
    let days = 30, who = "", limit = 50;

    function detailText(ev) {
      const d = ev.detail || {}, out = [];
      if (d.device) out.push(d.device);
      if (d.kind) out.push(DETAIL.kind[d.kind] || d.kind);
      if (d.endnotes != null) out.push(d.endnotes ? "정답 미주" : "정답 끝에");
      if (d.auto_number === false) out.push("번호 글자");
      if (d.where) out.push(`${d.where}: ${d.error || ""}`);
      if (d.causes && d.causes.length) out.push(`원인: ${d.causes.join(" / ")}`);
      if (d.kept) out.push("파일 보관됨");
      return out.join(" · ");
    }

    function renderTiles(s) {
      const items = [
        ["변환", s.conversions, "회"], ["변환한 파일", s.files, "개"], ["쪽수", s.pages, "쪽"],
        ["문제", s.questions, "개"], ["내려받기", s.downloads, "회"], ["오류", s.errors, "건"],
      ];
      $("#tiles").innerHTML = items.map(([k, v, u]) => `<div class="card tile"><span>${k}</span><b>${num(v)}<small> ${u}</small></b></div>`).join("");
    }

    // 막대: 90일까지는 하루 단위, 1년은 달 단위(빈 날도 0으로 채움)
    function renderChart(s) {
      const byDate = Object.fromEntries(s.days.map((d) => [d.date, d.conversions]));
      const buckets = [];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      if (days <= 90) {
        for (let i = days - 1; i >= 0; i--) {
          const d = new Date(today); d.setDate(d.getDate() - i);
          const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          buckets.push({ label: `${d.getMonth() + 1}/${d.getDate()}`, full: `${d.getMonth() + 1}월 ${d.getDate()}일`, n: byDate[key] || 0 });
        }
        $("#chart-hint").textContent = "하루 단위";
      } else {
        for (let i = 11; i >= 0; i--) {
          const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
          const pre = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
          const n = s.days.filter((x) => x.date.startsWith(pre)).reduce((a, x) => a + x.conversions, 0);
          buckets.push({ label: `${d.getMonth() + 1}월`, full: `${d.getFullYear()}년 ${d.getMonth() + 1}월`, n });
        }
        $("#chart-hint").textContent = "달 단위";
      }
      const max = Math.max(1, ...buckets.map((b) => b.n));
      const step = Math.max(1, Math.ceil(max / 3));
      const top = step * 3;
      const every = Math.ceil(buckets.length / 8);
      const grid = [1, 2, 3].map((k) => `<div class="gridline" style="bottom:${22 + (158 * k * step) / top}px"><span>${k * step}</span></div>`).join("");
      $("#chart").innerHTML = grid + buckets.map((b, i) => `<div class="cbar" data-tip="${esc(b.full)} · 변환 ${b.n}회"><i style="height:${(b.n / top) * 100}%"></i>${i % every === 0 || (i === buckets.length - 1 && i % every >= every / 2) ? `<em>${esc(b.label)}</em>` : ""}</div>`).join("");
    }

    function renderPeople(users) {
      if (!users.length) { $("#people").innerHTML = `<tr><td class="empty">이 기간에는 기록이 없어요.</td></tr>`; return; }
      $("#people").innerHTML = `<thead><tr><th>사람</th><th class="num">변환</th><th class="num">파일</th><th class="num">쪽</th><th class="num">문제</th><th>마지막 이용</th></tr></thead><tbody>` +
        users.map((u) => `<tr><td><b>${esc(u.user)}</b></td><td class="num">${num(u.conversions)}</td><td class="num">${num(u.files)}</td><td class="num">${num(u.pages)}</td><td class="num">${num(u.questions)}</td><td class="muted">${ago(u.last_seen)}</td></tr>`).join("") + "</tbody>";
    }

    function renderRecent(rows) {
      if (!rows.length) { $("#recent").innerHTML = `<tr><td class="empty">아직 기록이 없어요.</td></tr>`; return; }
      $("#recent").innerHTML = `<thead><tr><th>시각</th><th>사람</th><th>동작</th><th class="num">파일</th><th class="num">쪽</th><th class="num">문제</th><th>결과</th><th class="num">걸린 시간</th><th>기타</th></tr></thead><tbody>` +
        rows.map((r) => {
          const st = STATUS[r.status];
          const status = st ? `<span class="tag ${st[1]}">${st[0]}</span>` : (r.event === "error" ? `<span class="tag bad">오류</span>` : "");
          return `<tr><td class="muted">${fmtTime(r.ts)}</td><td>${esc(r.user)}</td><td>${esc(r.label)}</td><td class="num">${num(r.files)}</td><td class="num">${num(r.pages)}</td><td class="num">${num(r.questions)}</td><td>${status}</td><td class="num">${r.seconds != null ? r.seconds.toFixed(1) + "초" : ""}</td><td class="muted">${esc(detailText(r))}</td></tr>`;
        }).join("") + "</tbody>";
    }

    // 문제 생긴 파일: 결과가 '문제 있음'이거나 오류가 난 파일만 서버가 보관(정해진 날짜 뒤 자동 삭제)
    async function loadKept() {
      const res = await fetch("/api/admin/samples");
      if (!res.ok) return;
      const d = await res.json();
      $("#kept-card").hidden = !d.enabled;
      if (!d.enabled) return;
      $("#kept-hint").textContent = `'문제 있음'·오류 파일만 자동 보관 · ${d.keep_days}일 뒤 삭제 · 최대 ${d.max_count}개`;
      if (!d.items.length) { $("#kept").innerHTML = `<tr><td class="empty">문제 생긴 파일이 없어요.</td></tr>`; return; }
      $("#kept").innerHTML = `<thead><tr><th>마지막 시각</th><th>사람</th><th>동작</th><th>파일</th><th class="num">쪽</th><th>결과</th><th>원인</th><th class="num">횟수</th><th>삭제까지</th><th></th></tr></thead><tbody>` +
        d.items.map((k) => {
          const names = k.files.map((f) => f.name);
          const name = names.length > 1 ? `${names[0]} 외 ${names.length - 1}개` : names[0];
          const cause = k.status === "error" ? (k.error.trim().split("\n").pop() || "오류") : k.causes.join(" / ");
          const st = k.status === "FAIL" ? `<span class="tag bad">문제 있음</span>` : `<span class="tag bad">오류</span>`;
          const left = Math.max(0, Math.ceil((k.expires_at - Date.now() / 1000) / 86400));
          return `<tr><td class="muted">${fmtTime(k.ts)}</td><td>${esc(k.user)}</td><td>${esc(k.kind_label)}</td><td class="kept-name" title="${esc(names.join("\n"))}">${esc(name)}</td><td class="num">${num(k.pages)}</td><td>${st}</td><td class="kept-cause">${esc(cause)}</td><td class="num">${num(k.count)}</td><td class="muted">${left}일</td>` +
            `<td><div class="kept-act"><a href="/api/admin/samples/${encodeURIComponent(k.id)}/download" download>내려받기</a><button type="button" data-del="${esc(k.id)}">삭제</button></div></td></tr>`;
        }).join("") + "</tbody>";
    }
    $("#kept").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-del]");
      if (!b || !confirm("이 파일을 지울까요? 되돌릴 수 없어요.")) return;
      await fetch(`/api/admin/samples/${encodeURIComponent(b.dataset.del)}`, { method: "DELETE" });
      loadKept();
    });

    async function load() {
      const res = await fetch(`/api/admin/usage?days=${days}&limit=${limit}&user=${encodeURIComponent(who)}`);
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        document.querySelector(".admin").innerHTML = `<div class="card card-body"><h1>볼 수 없어요</h1><p class="sub">${esc(d.detail || res.status)}</p></div>`;
        return;
      }
      const d = await res.json();
      $("#keep").textContent = `기록은 ${Math.round(d.keep_days)}일 동안 보관해요.`;
      const sel = $("#who");
      if (sel.options.length === 1) {
        const names = new Set([...(d.people || []), ...d.everyone.map((u) => u.user)]);
        for (const n of [...names].sort()) sel.add(new Option(n, n));
      }
      $("#live").textContent = `지금 열린 작업 ${d.now.jobs}개${d.now.converting ? " · 변환 중" : ""}`;
      $("#csv").href = `/api/admin/usage.csv?user=${encodeURIComponent(who)}`;
      // 요약·그래프·최근 기록은 고른 사람 것만, 사람별 표는 항상 모두
      renderTiles(d.summary);
      renderChart(d.summary);
      renderPeople(d.everyone);
      renderRecent(d.recent);
      $("#recent-hint").textContent = `최근 ${d.recent.length}건`;
      $("#more").hidden = d.recent.length < limit || limit >= 1000;
    }

    document.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => {
      days = +b.dataset.days;
      document.querySelectorAll("[data-days]").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
      load();
    }));
    $("#who").addEventListener("change", (e) => { who = e.target.value; limit = 50; load(); });
    $("#more").addEventListener("click", () => { limit = Math.min(1000, limit * 4); load(); });

    const tip = $("#tip");
    $("#chart").addEventListener("mousemove", (e) => {
      const bar = e.target.closest(".cbar");
      if (!bar) { tip.classList.remove("show"); return; }
      tip.textContent = bar.dataset.tip;
      tip.style.left = `${Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12)}px`;
      tip.style.top = `${e.clientY - 34}px`;
      tip.classList.add("show");
    });
    $("#chart").addEventListener("mouseleave", () => tip.classList.remove("show"));
    load();
    loadKept();
  })();
  </script>
</body>
</html>
