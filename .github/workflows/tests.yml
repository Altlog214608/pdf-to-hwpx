name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            webapp/requirements.txt
      - run: pip install -r requirements.txt -r webapp/requirements.txt httpx
      - run: python -m pytest tests -q
